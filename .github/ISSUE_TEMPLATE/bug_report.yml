name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include passwords, tokens or real customer data. Security issues go through SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Create a table with ...
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: dropdown
    id: deploy
    attributes:
      label: Deployment
      options:
        - docker compose (minimal)
        - docker compose (full)
        - development (pnpm dev)
        - other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs and request id
      description: The `request_id` from the error message helps a lot. Remove any record values.
      render: text
