name: Perf
# A full run (every spec once) is titled `Perf`; a dispatch with `grep` or `repeat` says so,
# and the `night` job below does not take it for a full run.
run-name: >-
  ${{ github.event_name == 'workflow_dispatch' && (inputs.grep != '' || inputs.repeat != '1')
  && format('Perf (grep: {0}, repeat: {1})', inputs.grep, inputs.repeat) || 'Perf' }}

# Performance budgets of FRONTEND §11.1 (`@perf` Playwright specs on 200 000 seeded
# rows) on a GitHub `ubuntu-latest` runner (BACKLOG T801). It asserts the `ci-runner`
# profile of `apps/web/e2e/perf-results.ts` (regression bounds calibrated on this
# runner, T900); the summary shows the `product` budgets next to them.
# Nightly and on demand only: never on pull requests, so it does not gate a merge.
# Only green full runs on new commits count toward the streak of green nights (FRONTEND
# §11.1): a scheduled night on the commit of the last green full run skips; a dispatch
# on it runs and says "no new commit".
on:
  schedule:
    # 03:27 UTC, away from the top of the hour when scheduled runs queue up.
    - cron: '27 3 * * *'
  workflow_dispatch:
    inputs:
      grep:
        description: Only run tests whose title matches this regular expression (empty = every @perf spec)
        required: false
        default: ''
      repeat:
        description: Run each test this many times (1–5); the summary and perf-results.json list every run (`Run` column, `repeat_index`)
        required: false
        default: '1'

permissions:
  contents: read

concurrency:
  group: perf-${{ github.ref }}
  cancel-in-progress: false

env:
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  # Is there a new commit since the last green full run of this branch? Counts or skips.
  night:
    name: New commit since the last green run?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      skip: ${{ steps.check.outputs.skip }}
      streak: ${{ steps.check.outputs.streak }}
    steps:
      - name: Last green full run
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          RUN_KIND: ${{ github.event_name == 'workflow_dispatch' && (inputs.grep != '' || inputs.repeat != '1') && 'partial' || 'full' }}
        run: |
          last=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow perf.yml --branch "$GITHUB_REF_NAME" \
            --status success --limit 50 --json headSha,displayTitle,url \
            --jq '[.[] | select(.displayTitle == "Perf")][0] // empty | "\(.headSha) \(.url)"') || last=''
          last_sha=${last%% *}
          last_url=${last#* }
          skip=false
          if [ -n "$last" ] && [ "$last_sha" = "$GITHUB_SHA" ]; then
            if [ "$EVENT" = schedule ]; then
              skip=true
              streak="no new commit since the last green run (${last_url}): skipped, not counted"
            else
              streak="no new commit since the last green run (${last_url}): not counted"
            fi
          elif [ "$RUN_KIND" = partial ]; then
            streak='partial run (grep or repeat): not counted'
          else
            streak='new commit: counts if green'
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          echo "streak=$streak" >> "$GITHUB_OUTPUT"
          previous=none
          if [ -n "$last_sha" ]; then previous="\`$last_sha\`"; fi
          {
            echo '## Streak of green nights'
            echo
            echo "Commit \`${GITHUB_SHA}\` · last green full run: ${previous}"
            echo
            if [ "$skip" = true ]; then echo "**No new commit**: ${streak}."; else echo "Streak: ${streak}."; fi
            echo
          } | tee -a "$GITHUB_STEP_SUMMARY"

  perf:
    name: Perf (@perf, ubuntu-latest)
    needs: night
    if: needs.night.outputs.skip != 'true'
    runs-on: ubuntu-latest
    # Build + 200 000-row bench seed + ten budgets: ~15 minutes; room for `repeat`.
    timeout-minutes: 120
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          turbo-cache-key: perf
      - name: Install Playwright browsers
        run: pnpm --filter @cellhive/web exec playwright install --with-deps chromium
      # Hosted runners are not one machine: AMD EPYC 7763 and Intel Xeon 6973P-C were
      # 1.3–1.4× apart on the same commit (BACKLOG T818). The CPU heads the summary and
      # is in `perf-results.json` (`machine.cpu_*`, perf-reporter) and the perf issue.
      - name: Machine
        id: machine
        env:
          STREAK: ${{ needs.night.outputs.streak }}
        run: |
          model=$(lscpu | sed -n 's/^Model name:[[:space:]]*//p' | head -n1)
          sockets=$(lscpu | sed -n 's/^Socket(s):[[:space:]]*//p' | head -n1)
          per_socket=$(lscpu | sed -n 's/^Core(s) per socket:[[:space:]]*//p' | head -n1)
          cpu="${model:-unknown CPU}, $(( ${sockets:-1} * ${per_socket:-0} )) cores / $(nproc) threads"
          echo "cpu=$cpu" >> "$GITHUB_OUTPUT"
          {
            echo '## Machine'
            echo
            echo "**CPU: $cpu**"
            echo
            # One key per run, to tabulate nights by CPU model (`perf-results.json`: machine.cpu_model).
            echo "\`cpu_model\`: ${model:-unknown}"
            echo
            echo "Streak: ${STREAK}."
            echo
            echo '```'
            echo "nproc: $(nproc)"
            lscpu | grep -E '^(Model name|Vendor ID|CPU\(s\)|Thread\(s\) per core|Core\(s\) per socket|Socket\(s\)|Hypervisor vendor|L3 cache):' || true
            free -h
            echo "image: ${ImageOS:-?} ${ImageVersion:-?}"
            echo "node: $(node --version)"
            pnpm --filter @cellhive/web exec playwright --version
            ls "$HOME/.cache/ms-playwright"
            echo '```'
            echo
          } | tee -a "$GITHUB_STEP_SUMMARY"
      # Inputs go through env, never interpolated into the script.
      - name: Run @perf specs
        env:
          PERF_PROFILE: ci-runner
          PERF_GREP: ${{ inputs.grep }}
          PERF_REPEAT: ${{ inputs.repeat }}
        run: |
          repeat="${PERF_REPEAT:-1}"
          if ! [[ "$repeat" =~ ^[1-5]$ ]]; then
            echo "::error::repeat must be a number from 1 to 5, got '$repeat'"
            exit 1
          fi
          args=(--repeat-each "$repeat")
          if [ -n "${PERF_GREP:-}" ]; then args+=(--grep "$PERF_GREP"); fi
          pnpm test:e2e:perf "${args[@]}"
      # The HTML report already holds the traces of failed tests (`test-results/` would double them).
      - name: Upload results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: perf-${{ github.sha }}
          path: |
            apps/web/perf-results.json
            apps/web/playwright-report/
          if-no-files-found: warn
          retention-days: 30
      # A red budget on the reference machine is a regression to look into; the job
      # never changes a budget. One open issue at a time: later red nights comment on it.
      - name: Open a perf issue
        if: failure() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUNNER_CPU: ${{ steps.machine.outputs.cpu }}
        run: |
          gh label create perf --color D93F0B --description 'Performance budget (FRONTEND §11.1)' 2>/dev/null || true
          body="The nightly perf job failed on \`${GITHUB_SHA}\`: ${RUN_URL}
          Runner CPU: ${RUNNER_CPU:-unknown}.
          Numbers and machine: artifact \`perf-${GITHUB_SHA}\` (\`perf-results.json\`) and the run summary."
          open=$(gh issue list --label perf --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "$body"
          else
            gh issue create --title "Perf budget red on main ($(date -u +%F))" --label perf --body "$body"
          fi
